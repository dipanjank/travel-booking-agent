[project]
name = "booking-mcp-server"
version = "0.1.0"
description = "Travel Booking MCP Server - flight search and booking tools over Streamable HTTP"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
